; Parametros NAO sensiveis da ferramenta de backup.
; A senha NUNCA fica aqui: ela e pedida no inicio da execucao (getpass).

[imap]
host = imap.skymail.net.br
porta = 993
timeout = 60
; "lote" = de quantas em quantas mensagens o estado e persistido (checkpoint de retomada).
lote = 50

[saida]
; Pasta base de saida. NAO use a Area de Trabalho (pode estar sincronizada com
; OneDrive e acessivel a outros usuarios). Use uma pasta local com permissoes
; restritas. Estrutura criada: <base>\<Nome>\<Nome>.pst e <base>\logs\.
base = C:\BackupsEmails

[pastas]
; Pastas a ignorar no download (nomes decodificados, separados por ';').
; Deixe vazio para o Skymail. Exemplo para Gmail/Workspace (evita duplicar tudo):
; ignorar = [Gmail]/Todos os e-mails;[Gmail]/All Mail
ignorar =
